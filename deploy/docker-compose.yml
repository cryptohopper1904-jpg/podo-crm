# PodoCRM auf eigenem Server (Docker + Caddy für HTTPS)
# Start:  cp deploy/.env.example deploy/.env  &&  (Werte setzen)  &&  docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: podo
      POSTGRES_USER: podo_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      PODO_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podo_owner -d podo"]
      interval: 10s
      retries: 5

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.migrate }
    environment:
      DATABASE_MIGRATION_URL: postgres://podo_owner:${DB_OWNER_PASSWORD}@db:5432/podo
      DATABASE_SEED_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      DB_APP_ROLE: podo_app
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - storage:/data/storage:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache gnupg >/dev/null && while true; do /backup.sh; sleep 86400; done"]
    depends_on: [db]

  # Erinnerungen/Rückholung: alle 15 Minuten den Erinnerungs-Lauf der App auslösen (intern, nicht über Caddy)
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep 900
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders >/dev/null || echo "$$(date -Iseconds) Erinnerungs-Lauf fehlgeschlagen"
        done
    depends_on: [app]

volumes:
  pgdata:
  storage:
  caddy_data:
  backups:
