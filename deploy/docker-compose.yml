# PodoCRM auf eigenem Server (Docker + Caddy für HTTPS)
# Start:  cp deploy/.env.example deploy/.env  &&  (Werte setzen)  &&  docker compose -f deploy/docker-compose.yml up -d --build
# Update: bash deploy/update.sh   (siehe docs/BETRIEB.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: podo
      POSTGRES_USER: podo_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      PODO_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podo_owner -d podo"]
      interval: 10s
      retries: 5

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.migrate }
    environment:
      DATABASE_MIGRATION_URL: postgres://podo_owner:${DB_OWNER_PASSWORD}@db:5432/podo
      DATABASE_SEED_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      DB_APP_ROLE: podo_app
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      STORAGE_DIR: /data/storage
      # Zeitstempel der letzten Backup-/Cron-Läufe (für /api/health/deep), nur lesend eingebunden
      STATUS_DIR: /data/status
    volumes:
      - storage:/data/storage
      - ops_status:/data/status:ro
    # Das Image enthält kein curl → dieselbe Prüfung von /api/health per Node-fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Tägliches verschlüsseltes Backup (erstes direkt beim Start). update.sh erstellt den Container bei jedem Update neu.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - storage:/data/storage:ro
      - ops_status:/status
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache gnupg >/dev/null
        while true; do
          /backup.sh || echo "$$(date -Iseconds) Backup FEHLGESCHLAGEN"
          sleep 86400
        done
    depends_on: [db]

  # Erinnerungen/Rückholung: alle 15 Minuten den Erinnerungs-Lauf der App auslösen (intern, nicht über Caddy)
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ops_status:/status
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep 900
          # Nach jedem erfolgreichen Lauf ein Zeitstempel nach /status (für /api/health/deep)
          if curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders >/dev/null; then
            date +%s > /status/cron-reminders.last
          else
            echo "$$(date -Iseconds) Erinnerungs-Lauf fehlgeschlagen"
          fi
          # KIM-Abruf (nur Praxen mit aktiver KIM-Verbindung; ohne CRON_SECRET antwortet die App mit 503)
          if curl -fsS -m 300 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/kim >/dev/null; then
            date +%s > /status/cron-kim.last
          else
            echo "$$(date -Iseconds) KIM-Abruf fehlgeschlagen"
          fi
        done
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
  backups:
  # Zeitstempel der letzten Backup-/Cron-Läufe (keine Personendaten)
  ops_status:
