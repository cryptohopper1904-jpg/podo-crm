# PodoCRM auf eigenem Server (Docker + Caddy für HTTPS)
# Start:  cp deploy/.env.example deploy/.env  &&  (Werte setzen)  &&  docker compose -f deploy/docker-compose.yml up -d --build
# Update: bash deploy/update.sh   (siehe docs/BETRIEB.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: podo
      POSTGRES_USER: podo_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      PODO_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podo_owner -d podo"]
      interval: 10s
      retries: 5

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.migrate }
    environment:
      DATABASE_MIGRATION_URL: postgres://podo_owner:${DB_OWNER_PASSWORD}@db:5432/podo
      DATABASE_SEED_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      DB_APP_ROLE: podo_app
      SEED_DEMO: ${SEED_DEMO:-false}
      # Demo-Passwort (scripts/seed-demo.ts, Gesamt-Review K1): ohne SEED_DEMO_PASSWORD erzeugt der Seed auf einer
      # echten Domain (PUBLIC_URL) ein Zufallspasswort und gibt es einmal im migrate-Log aus.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Bootstrap für frische Server ohne Shell (scripts/bootstrap.ts, idempotent). Passwörter nach dem
      # ersten Start aus deploy/.env entfernen – vorhandene Konten werden nie überschrieben.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DEMO: ${BOOTSTRAP_ADMIN_DEMO:-}
      BOOTSTRAP_PRACTICE_JSON: ${BOOTSTRAP_PRACTICE_JSON:-}
      BOOTSTRAP_PRACTICE_OWNER_PASSWORD: ${BOOTSTRAP_PRACTICE_OWNER_PASSWORD:-}
      BOOTSTRAP_STRICT: ${BOOTSTRAP_STRICT:-false}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    build: { context: .., dockerfile: Dockerfile, args: { GIT_SHA: "${GIT_SHA:-unknown}" } }
    restart: unless-stopped
    # KEIN env_file: Die App bekommt nur, was sie braucht (Gesamt-Review H2). DB_OWNER_PASSWORD (Tabelleneigentümer,
    # könnte RLS und Append-only-Trigger abschalten), BACKUP_PASSPHRASE und BOOTSTRAP_* bleiben bei db/migrate/backup.
    # Einträge ohne Wert übernimmt Compose aus deploy/.env; fehlt die Variable dort, ist sie im Container nicht gesetzt.
    # Neue App-Variablen hier ergänzen (Prüfung: src/lib/deploy-env.test.ts).
    environment:
      DATABASE_URL: postgres://podo_app:${DB_APP_PASSWORD}@db:5432/podo
      STORAGE_DIR: /data/storage
      # Zeitstempel der letzten Backup-/Cron-Läufe (für /api/health/deep), nur lesend eingebunden
      STATUS_DIR: /data/status
      APP_ENCRYPTION_KEY:
      PUBLIC_URL:
      PUBLIC_SITE_INDEX:
      ALLOW_SIGNUP:
      SETUP_TOKEN:
      TRUSTED_PROXY_HOPS:
      CRON_SECRET:
      HEALTH_TOKEN:
      INTEGRATIONS_MODE:
      LLM_DATA_PROCESSING_APPROVED:
      LLM_BASE_URL:
      LLM_API_KEY:
      LLM_MODEL:
      # Praxissuche (Vertrieb): eigenes, optionales LLM nur mit ausdrücklicher Freigabe (nie für Patientendaten)
      LEAD_SEARCH_LLM_APPROVED:
      LEAD_LLM_BASE_URL:
      LEAD_LLM_API_KEY:
      LEAD_LLM_MODEL:
      TRANSCRIPTION_DATA_PROCESSING_APPROVED:
      TRANSCRIPTION_BASE_URL:
      TRANSCRIPTION_API_KEY:
      TRANSCRIPTION_MODEL:
      # Touren/Fahrtenbuch: Routing (osrm|ors|off); Geokodierung (Photon) – auch für die Adress-Vervollständigung
      ROUTING_PROVIDER:
      OSRM_URL:
      ORS_API_KEY:
      ORS_URL:
      PHOTON_URL:
      TSE_PROVIDER:
      FISKALY_API_KEY:
      FISKALY_API_SECRET:
      FISKALY_TSS_ID:
      FISKALY_CLIENT_ID:
      ALLOW_TEST_PAYMENTS:
      BILLING_MODE:
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_PRICE_STARTER:
      STRIPE_PRICE_PRAXIS:
      STRIPE_PRICE_PLUS:
      STRIPE_PRICE_SEAT:
      SMTP_URL:
      SMTP_FROM:
      MAIL_RATE_PER_HOUR:
      SENTRY_DSN:
      ERROR_WEBHOOK_URL:
      ERROR_WEBHOOK_TOKEN:
      ADDRESS_PROVIDER:
      LOG_LEVEL:
      DB_POOL_MAX:
      APP_VERSION:
      APP_RELEASE:
    volumes:
      - storage:/data/storage
      - ops_status:/data/status:ro
    # Das Image enthält kein curl → dieselbe Prüfung von /api/health per Node-fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Tägliches verschlüsseltes Backup (erstes direkt beim Start). update.sh erstellt den Container bei jedem Update neu.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - storage:/data/storage:ro
      - ops_status:/status
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache gnupg >/dev/null
        while true; do
          /backup.sh || echo "$$(date -Iseconds) Backup FEHLGESCHLAGEN"
          sleep 86400
        done
    depends_on: [db]

  # Cron (intern, nicht über Caddy): Kalender-Abo alle 5 min, Erinnerungen/Rückholung und KIM alle 15 min
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ops_status:/status
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        i=0
        while true; do
          sleep 300
          i=$$((i + 1))
          # Kalender-Abo (iCal-Import, alle 5 min; nur Praxen mit aktivem Abo)
          if curl -fsS -m 240 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/kalender-abo >/dev/null; then
            date +%s > /status/cron-kalender-abo.last
          else
            echo "$$(date -Iseconds) Kalender-Abo-Abruf fehlgeschlagen"
          fi
          # Erinnerungen und KIM alle 15 min (jeder 3. Durchlauf)
          [ $$((i % 3)) -eq 0 ] || continue
          # Nach jedem erfolgreichen Lauf ein Zeitstempel nach /status (für /api/health/deep)
          if curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders >/dev/null; then
            date +%s > /status/cron-reminders.last
          else
            echo "$$(date -Iseconds) Erinnerungs-Lauf fehlgeschlagen"
          fi
          # KIM-Abruf (nur Praxen mit aktiver KIM-Verbindung; ohne CRON_SECRET antwortet die App mit 503)
          if curl -fsS -m 300 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/kim >/dev/null; then
            date +%s > /status/cron-kim.last
          else
            echo "$$(date -Iseconds) KIM-Abruf fehlgeschlagen"
          fi
          # Aufbewahrung einmal täglich: unbestätigte Online-Terminanfragen nach 6 Monaten löschen
          LAST=$$(cat /status/cron-aufbewahrung.last 2>/dev/null || echo 0)
          if [ $$(( $$(date +%s) - LAST )) -ge 86400 ]; then
            if curl -fsS -m 300 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/aufbewahrung >/dev/null; then
              date +%s > /status/cron-aufbewahrung.last
            else
              echo "$$(date -Iseconds) Aufbewahrungs-Lauf fehlgeschlagen"
            fi
          fi
          # Podologie-News alle 6 Stunden (öffentliche Feeds, keine Personendaten)
          LAST=$$(cat /status/cron-news.last 2>/dev/null || echo 0)
          if [ $$(( $$(date +%s) - LAST )) -ge 21600 ]; then
            if curl -fsS -m 300 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/news >/dev/null; then
              date +%s > /status/cron-news.last
            else
              echo "$$(date -Iseconds) News-Abruf fehlgeschlagen"
            fi
          fi
          # Praxissuche (Vertrieb) einmal pro Nacht: Container läuft in UTC, 01 UTC = 2 bzw. 3 Uhr deutscher Zeit.
          # Höchstens alle 20 h; läuft nur, wenn in der Plattform-Konsole eingeschaltet (sonst antwortet die App sofort).
          # Im Hintergrund (bis 15 min), damit Kalender-Abo/Erinnerungen nicht warten; parallele Läufe verhindert die App.
          LAST=$$(cat /status/cron-leads.last 2>/dev/null || echo 0)
          if [ "$$(date -u +%H)" = "01" ] && [ $$(( $$(date +%s) - LAST )) -ge 72000 ]; then
            (
              if curl -fsS -m 900 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/lead-search >/dev/null; then
                date +%s > /status/cron-leads.last
              else
                echo "$$(date -Iseconds) Praxissuche fehlgeschlagen"
              fi
            ) &
          fi
        done
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
  backups:
  # Zeitstempel der letzten Backup-/Cron-Läufe (keine Personendaten)
  ops_status:
