name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Secret-Scan mit gitleaks (Regeln/Ausnahmen: .gitleaks.toml).
  # Push auf main: gesamte Historie. Pull Request: nur die Commits des PRs.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks installieren (feste Version, Prüfsumme)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" version
      - name: Historie scannen (Push)
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'
      - name: PR-Commits scannen
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .'

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podo_owner
          POSTGRES_PASSWORD: podo_owner
          POSTGRES_DB: podo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U podo_owner" --health-interval 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_test
      DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_test
      TEST_DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_test
      TEST_OWNER_DATABASE_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_test
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      INTEGRATIONS_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Abhängigkeiten prüfen (nicht blockierend, siehe docs/compliance/PENTEST-CHECKLISTE.md)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: App-Rolle anlegen
        run: PGPASSWORD=podo_owner psql -h localhost -U podo_owner -d podo_test -c "create role podo_app login password 'podo_app' nosuperuser nobypassrls"
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podo_owner
          POSTGRES_PASSWORD: podo_owner
          POSTGRES_DB: podo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U podo_owner" --health-interval 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_e2e
      DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_e2e
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      INTEGRATIONS_MODE: mock
      STORAGE_DIR: /tmp/podo-storage
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: App-Rolle anlegen
        run: PGPASSWORD=podo_owner psql -h localhost -U podo_owner -d podo_e2e -c "create role podo_app login password 'podo_app' nosuperuser nobypassrls"
      - run: pnpm db:migrate
      - name: Demo-Praxis anlegen
        run: pnpm db:seed
      - run: pnpm build
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: E2E (startet next start auf E2E_PORT)
        run: pnpm exec playwright test --trace off
      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
