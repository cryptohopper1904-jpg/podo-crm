name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podo_owner
          POSTGRES_PASSWORD: podo_owner
          POSTGRES_DB: podo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U podo_owner" --health-interval 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_test
      DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_test
      TEST_DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_test
      TEST_OWNER_DATABASE_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_test
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      INTEGRATIONS_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Abhängigkeiten prüfen (nicht blockierend, siehe docs/compliance/PENTEST-CHECKLISTE.md)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: App-Rolle anlegen
        run: PGPASSWORD=podo_owner psql -h localhost -U podo_owner -d podo_test -c "create role podo_app login password 'podo_app' nosuperuser nobypassrls"
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podo_owner
          POSTGRES_PASSWORD: podo_owner
          POSTGRES_DB: podo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U podo_owner" --health-interval 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://podo_owner:podo_owner@localhost:5432/podo_e2e
      DATABASE_URL: postgres://podo_app:podo_app@localhost:5432/podo_e2e
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      INTEGRATIONS_MODE: mock
      STORAGE_DIR: /tmp/podo-storage
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: App-Rolle anlegen
        run: PGPASSWORD=podo_owner psql -h localhost -U podo_owner -d podo_e2e -c "create role podo_app login password 'podo_app' nosuperuser nobypassrls"
      - run: pnpm db:migrate
      - name: Demo-Praxis anlegen
        run: pnpm db:seed
      - run: pnpm build
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: E2E (startet next start auf E2E_PORT)
        run: pnpm exec playwright test --trace off
      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
